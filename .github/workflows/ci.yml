name: Flutter CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze_and_test:
    name: Analyze, Test & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ต้องตรงกับ Dart SDK ใน pubspec.yaml (^3.12) — 3.29.0 เก่าเกินจน pub get ล้ม
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # ยังมีไฟล์ที่ไม่ได้ format อยู่ แจ้งเตือนไว้ก่อน ไม่ให้ล้มทั้ง pipeline
      - name: Verify formatting
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test

      # warning/info เดิมยังมีอยู่ ให้ล้มเฉพาะ error ก่อน แล้วค่อยเข้มขึ้นเมื่อเคลียร์ครบ
      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run unit & widget tests with coverage
        run: flutter test --coverage

      - name: Coverage summary
        run: |
          sudo apt-get install -y lcov
          lcov --summary coverage/lcov.info || true

  functions:
    name: Cloud Functions build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run build

  firestore_rules:
    name: Firestore rules tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install -g firebase-tools
      # รันกับ emulator เท่านั้น ไม่ต้องใช้ credential และไม่แตะโปรเจกต์จริง
      - run: firebase emulators:exec --project bok-mai-db --only firestore "node scripts/test_rules.js"

  build_android:
    name: Build Android APK
    needs: analyze_and_test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug
